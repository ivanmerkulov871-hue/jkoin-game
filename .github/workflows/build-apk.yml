name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: cimg/android:2024.01-node
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Prepare www
        run: |
          mkdir -p www
          cp game.html www/index.html
          cp background.png www/
          cp chest.png www/

      - name: Install Node 22
        run: |
          cd /tmp
          wget -q https://nodejs.org/dist/v22.11.0/node-v22.11.0-linux-x64.tar.xz
          tar -xf node-v22.11.0-linux-x64.tar.xz
          rm -f /usr/local/bin/node /usr/local/bin/npm /usr/local/bin/npx
          ln -sf /tmp/node-v22.11.0-linux-x64/bin/node /usr/local/bin/node
          ln -sf /tmp/node-v22.11.0-linux-x64/bin/npm /usr/local/bin/npm
          ln -sf /tmp/node-v22.11.0-linux-x64/bin/npx /usr/local/bin/npx
          hash -r
          node --version

      - name: Install Capacitor
        run: |
          npm install -g @capacitor/cli
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Init Capacitor
        run: |
          npx cap init "JKOIN" "com.jkartie.game" --web-dir=www
          npx cap add android
          npx cap sync

      - name: Fix Android build.gradle
        working-directory: android
        run: |
          # Смотрим что там на строке 35 в app/build.gradle
          echo "=== app/build.gradle line 30-40 ==="
          sed -n '30,40p' app/build.gradle
          # Заменяем все упоминания androidxAppCompatVersion на правильные переменные
          sed -i 's/\$androidxAppCompatVersion/$androidXAppCompatVersion/g' app/build.gradle
          # Выводим переменные
          cat > variables.gradle << 'EOF'
          ext {
              minSdkVersion = 22
              compileSdkVersion = 34
              targetSdkVersion = 34
              androidXCore = "1.10.1"
              androidXAppCompat = "1.6.1"
              androidXMaterial = "1.9.0"
              androidXAppCompatVersion = "1.6.1"
              androidxActivityVersion = "1.8.0"
              androidxFragmentVersion = "1.6.2"
              androidxWebkitVersion = "1.8.0"
              junitVersion = "4.13.2"
              androidxJunitVersion = "1.1.5"
              androidxEspressoCoreVersion = "3.5.1"
              cordovaAndroidVersion = "10.1.1"
          }
          EOF

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: jkoin-game-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
