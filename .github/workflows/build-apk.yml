name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: cimg/android:2024.01-node
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Prepare www
        run: |
          mkdir -p www
          cp game.html www/index.html
          cp background.png www/
          cp chest.png www/

      - name: Install Node 22
        run: |
          cd /tmp
          wget -q https://nodejs.org/dist/v22.11.0/node-v22.11.0-linux-x64.tar.xz
          tar -xf node-v22.11.0-linux-x64.tar.xz
          rm -f /usr/local/bin/node /usr/local/bin/npm /usr/local/bin/npx
          ln -sf /tmp/node-v22.11.0-linux-x64/bin/node /usr/local/bin/node
          ln -sf /tmp/node-v22.11.0-linux-x64/bin/npm /usr/local/bin/npm
          ln -sf /tmp/node-v22.11.0-linux-x64/bin/npx /usr/local/bin/npx
          hash -r
          node --version

      - name: Install Capacitor
        run: |
          npm install -g @capacitor/cli
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Init Capacitor
        run: |
          npx cap init "JKOIN" "com.jkartie.game" --web-dir=www
          npx cap add android
          npx cap sync

      - name: Install Java 21
        run: |
          cd /tmp
          wget -q https://download.java.net/java/GA/jdk21.0.2/f2283984656d49d69e91c558476027ac/13/GPL/openjdk-21.0.2_linux-x64_bin.tar.gz
          tar -xzf openjdk-21.0.2_linux-x64_bin.tar.gz
          mv jdk-21.0.2 /opt/java21
          echo "JAVA_HOME=/opt/java21" >> $GITHUB_ENV
          echo "/opt/java21/bin" >> $GITHUB_PATH
          export JAVA_HOME=/opt/java21
          export PATH=/opt/java21/bin:$PATH
          java -version

      - name: Generate Keystore
        working-directory: android
        run: |
          export JAVA_HOME=/opt/java21
          export PATH=/opt/java21/bin:$PATH
          keytool -genkeypair -v \
            -keystore jkoin.keystore \
            -alias jkoin \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass jkoin12345 \
            -keypass jkoin12345 \
            -dname "CN=JKoin, OU=Game, O=JKARTIE, L=Moscow, S=Moscow, C=RU"
          ls -la jkoin.keystore
          base64 jkoin.keystore > jkoin.keystore.txt
          echo "=========================================="
          echo "===== СКОПИРУЙ ЭТУ СТРОКУ BASE64 ====="
          echo "=========================================="
          cat jkoin.keystore.txt
          echo ""
          echo "=========================================="
          echo "===== КОНЕЦ BASE64 ====="
          echo "=========================================="

      - name: Build APK
        working-directory: android
        env:
          JAVA_HOME: /opt/java21
        run: |
          export JAVA_HOME=/opt/java21
          export PATH=/opt/java21/bin:$PATH
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$PWD/jkoin.keystore \
            -Pandroid.injected.signing.store.password=jkoin12345 \
            -Pandroid.injected.signing.key.alias=jkoin \
            -Pandroid.injected.signing.key.password=jkoin12345

      - uses: actions/upload-artifact@v4
        with:
          name: jkoin-game-apk
          path: android/app/build/outputs/apk/release/app-release.apk
