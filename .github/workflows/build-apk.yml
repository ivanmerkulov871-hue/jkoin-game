name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: cimg/android:2024.01-node
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Prepare www
        run: |
          mkdir -p www
          cp game.html www/index.html
          cp background.png www/
          cp chest.png www/

      - name: Install Node 22
        run: |
          cd /tmp
          wget -q https://nodejs.org/dist/v22.11.0/node-v22.11.0-linux-x64.tar.xz
          tar -xf node-v22.11.0-linux-x64.tar.xz
          rm -f /usr/local/bin/node /usr/local/bin/npm /usr/local/bin/npx
          ln -sf /tmp/node-v22.11.0-linux-x64/bin/node /usr/local/bin/node
          ln -sf /tmp/node-v22.11.0-linux-x64/bin/npm /usr/local/bin/npm
          ln -sf /tmp/node-v22.11.0-linux-x64/bin/npx /usr/local/bin/npx
          hash -r
          node --version

      - name: Install Java 21
        run: |
          cd /tmp
          wget -q https://download.java.net/java/GA/jdk21.0.2/f2283984656d49d69e91c558476027ac/13/GPL/openjdk-21.0.2_linux-x64_bin.tar.gz
          tar -xzf openjdk-21.0.2_linux-x64_bin.tar.gz
          mv jdk-21.0.2 /opt/java21
          echo "JAVA_HOME=/opt/java21" >> $GITHUB_ENV
          echo "/opt/java21/bin" >> $GITHUB_PATH
          export JAVA_HOME=/opt/java21
          export PATH=/opt/java21/bin:$PATH
          java -version

      - name: Install Capacitor
        run: |
          npm install -g @capacitor/cli
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Init Capacitor
        run: |
          npx cap init "JKOIN" "com.jkartie.game" --web-dir=www
          npx cap add android
          npx cap sync

      - name: Build APK
        working-directory: android
        env:
          JAVA_HOME: /opt/java21
        run: |
          chmod +x gradlew
          export JAVA_HOME=/opt/java21
          export PATH=/opt/java21/bin:$PATH
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: jkoin-game-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
