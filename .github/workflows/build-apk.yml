name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: cimg/android:2024.01-node
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Prepare www
        run: |
          mkdir -p www
          cp game.html www/index.html
          cp background.png www/
          cp chest.png www/

      - name: Install Node 22
        run: |
          cd /tmp
          wget -q https://nodejs.org/dist/v22.11.0/node-v22.11.0-linux-x64.tar.xz
          tar -xf node-v22.11.0-linux-x64.tar.xz
          rm -f /usr/local/bin/node /usr/local/bin/npm /usr/local/bin/npx
          ln -sf /tmp/node-v22.11.0-linux-x64/bin/node /usr/local/bin/node
          ln -sf /tmp/node-v22.11.0-linux-x64/bin/npm /usr/local/bin/npm
          ln -sf /tmp/node-v22.11.0-linux-x64/bin/npx /usr/local/bin/npx
          hash -r
          node --version
          npm --version

      - name: Install Capacitor
        run: |
          npm install -g @capacitor/cli
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Init Capacitor
        run: |
          npx cap init "JKOIN" "com.jkartie.game" --web-dir=www
          npx cap add android
          npx cap sync

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: jkoin-game-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
