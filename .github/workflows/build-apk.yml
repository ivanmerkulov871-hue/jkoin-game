name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java 17 for SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools latest
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Setup Java 11 for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Prepare www
        run: |
          mkdir -p www
          cp game.html www/index.html
          cp background.png www/
          cp chest.png www/

      - name: Install Capacitor 5
        run: |
          npm install -g @capacitor/cli@5
          npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/android@5

      - name: Init Capacitor
        run: |
          npx cap init "JKOIN" "com.jkartie.game" --web-dir=www
          npx cap add android
          npx cap sync

      - name: Fix Android SDK syntax
        working-directory: android
        run: |
          cat > variables.gradle << 'EOF'
          ext {
              minSdkVersion = 22
              compileSdkVersion = 33
              targetSdkVersion = 33
              androidXCore = "1.8.0"
              androidXAppCompat = "1.6.1"
              androidXMaterial = "1.9.0"
          }
          EOF

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: jkoin-game-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
