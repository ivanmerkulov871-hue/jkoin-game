name: Сборка APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Install Capacitor CLI & Core
      run: |
        npm install -g @capacitor/cli
        npm install @capacitor/core @capacitor/android

    - name: Init Capacitor and Prepare WWW
      run: |
        # Создаем конфиг Capacitor
        cat <<EOF > capacitor.config.json
        {
          "appId": "com.jkoin.game",
          "appName": "JKOIN",
          "webDir": "www"
        }
        EOF
        
        # Создаем папку www и копируем туда ВСЁ
        mkdir -p www
        cp game.html www/index.html
        cp background.png www/ || true
        cp chest.png www/ || true
        cp icon.png www/ || true
        cp сумка.png www/ || true
        cp -r legendary www/ || true
        
        # Добавляем платформу Android
        npx cap add android
        npx cap sync android

    - name: Restore Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        echo "$KEYSTORE_BASE64" | base64 -d > android/app/jkoin.keystore

    - name: Build Android APK
      working-directory: android
      run: |
        chmod +x gradlew
        ./gradlew assembleRelease \
          -Pandroid.injected.signing.store.file=$(pwd)/app/jkoin.keystore \
          -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
          -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
          -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: JKOIN-APK
        path: android/app/build/outputs/apk/release/app-release.apk
