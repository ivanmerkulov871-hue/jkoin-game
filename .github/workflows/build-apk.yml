name: Generate Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    container:
      image: cimg/android:2024.01-node
      options: --user root
    steps:
      - name: Install Java 21
        run: |
          cd /tmp
          wget -q https://download.java.net/java/GA/jdk21.0.2/f2283984656d49d69e91c558476027ac/13/GPL/openjdk-21.0.2_linux-x64_bin.tar.gz
          tar -xzf openjdk-21.0.2_linux-x64_bin.tar.gz
          mv jdk-21.0.2 /opt/java21
          export JAVA_HOME=/opt/java21
          export PATH=/opt/java21/bin:$PATH
          java -version

      - name: Generate Keystore
        run: |
          export JAVA_HOME=/opt/java21
          export PATH=/opt/java21/bin:$PATH
          keytool -genkeypair -v \
            -keystore jkoin.keystore \
            -alias jkoin \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass jkoin12345 \
            -keypass jkoin12345 \
            -dname "CN=JKoin, OU=Game, O=JKARTIE, L=Moscow, S=Moscow, C=RU"
          echo "===== KEYSTORE READY ====="
          ls -la jkoin.keystore
          echo ""
          echo "===== BASE64 START ====="
          base64 -w 0 jkoin.keystore
          echo ""
          echo "===== BASE64 END ====="
